<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Air Combat 3D - Ocean Storm</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#06111d;color:#fff;font-family:Segoe UI,Tahoma,sans-serif;user-select:none;touch-action:none}#canvas-container{width:100vw;height:100vh}.hidden{display:none!important}
#ui-layer{position:absolute;inset:0;padding:12px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}.hud{display:flex;justify-content:space-between;gap:8px}.hud-box{background:rgba(4,18,32,.78);border:1px solid #39dfff;border-radius:9px;padding:9px 12px;color:#8eeeff;font-weight:bold;font-size:14px;text-shadow:0 0 8px #00cfff}.controls{display:flex;justify-content:space-between;align-items:flex-end}.joystick-zone{width:132px;height:132px;border:3px dashed rgba(70,220,255,.65);border-radius:50%;background:rgba(30,170,220,.08);position:relative;pointer-events:auto}.joystick-knob{width:50px;height:50px;background:#45ddff;border-radius:50%;position:absolute;left:38px;top:38px;box-shadow:0 0 18px #00d9ff}.fire{width:92px;height:92px;border-radius:50%;background:rgba(255,35,55,.3);border:3px solid #ff304c;color:#ff5268;display:flex;align-items:center;justify-content:center;font-weight:bold;pointer-events:auto}.screen{position:absolute;inset:0;z-index:20;background:rgba(3,11,22,.92);backdrop-filter:blur(7px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center}.screen h1{margin:0 0 5px;color:#55e7ff;text-shadow:0 0 20px #00b9e8;font-size:34px}.screen h2{margin:0 0 18px;color:#9bc4dc;font-weight:normal}.status{color:#75ffd0;margin:10px;max-width:90%}.btn{width:285px;padding:14px;margin:6px;border:0;border-radius:24px;color:#fff;font-weight:bold;font-size:15px;background:linear-gradient(135deg,#075bff,#20d9ff);box-shadow:0 5px 18px rgba(0,190,255,.3)}.btn.shop{background:linear-gradient(135deg,#6b19e8,#ef43b8)}.btn.paypal{background:linear-gradient(135deg,#003087,#0079c1)}.btn.dark{background:#172b3d;border:1px solid #45677f}.shop-grid{width:min(900px,96vw);display:flex;gap:10px;overflow-x:auto;padding:10px}.card{min-width:210px;background:rgba(13,32,48,.96);border:1px solid #39708b;border-radius:14px;padding:12px}.card h3{margin:5px;color:#6eeaff}.card p{margin:6px;font-size:13px;color:#b8cbd5}.price{color:#ffd15c;font-weight:bold}.notification{position:absolute;z-index:99;top:75px;left:50%;transform:translateX(-50%);background:#79ffd1;color:#042019;padding:10px 18px;border-radius:22px;font-weight:bold;display:none}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script></head>
<body>
<div id="canvas-container"></div><div id="notification" class="notification"></div>
<div id="ui-layer"><div class="hud"><div class="hud-box" id="hud-level">Mission 1 / 40</div><div class="hud-box" id="hud-credits">Credits 100</div><div class="hud-box" id="hud-targets">Feinde 0</div></div><div class="controls"><div class="joystick-zone" id="joystick"><div class="joystick-knob" id="knob"></div></div><div class="fire" id="fire">FEUER</div></div></div>
<div id="menu" class="screen"><h1>AIR COMBAT 3D</h1><h2>Ocean Storm Combat</h2><div class="status" id="menuStats"></div><button class="btn" id="start">MISSION STARTEN</button><button class="btn shop" id="openShop">✈ FLUGZEUG-SHOP</button><button class="btn paypal" id="buyCredits">500 CREDITS (PAYPAL)</button></div>
<div id="shop" class="screen hidden"><h1>✈ FLUGZEUG-SHOP</h1><div class="status">Kaufe schnellere Jets mit stärkeren Waffen.</div><div class="shop-grid" id="shopGrid"></div><button class="btn dark" id="closeShop">ZURÜCK</button></div>
<div id="result" class="screen hidden"><h1 id="resultTitle">MISSION</h1><div class="status" id="resultDesc"></div><button class="btn" id="next">NÄCHSTE MISSION</button><button class="btn" id="retry">ERNEUT VERSUCHEN</button><button class="btn shop" id="resultShop">SHOP</button><button class="btn paypal hidden" id="resultBuy">CREDITS AUFLADEN</button></div>
<script>
const stateKey='aircombat_v4_state';
let gameState={currentLevel:1,maxLevels:40,credits:100,plane:'starter',owned:['starter']};try{const s=JSON.parse(localStorage.getItem(stateKey));if(s)gameState={...gameState,...s}}catch(e){}
const planes={starter:{name:'Falcon',price:0,color:0x3c6f9d,damage:1,fireRate:260,speed:1},hawk:{name:'Hawk',price:300,color:0x3ccf8c,damage:2,fireRate:220,speed:1.12},viper:{name:'Viper',price:700,color:0xd34d4d,damage:3,fireRate:180,speed:1.25},storm:{name:'Storm X',price:1200,color:0xa65cff,damage:5,fireRate:145,speed:1.42}};
let paypalTimer=null,paypalStartedAt=0,paypalWaiting=false;let audioCtx=null,masterGain=null,engineOsc=null,rainSource=null,rainGain=null;
function initAudio(){
  try{
    if(!audioCtx){
      const AC=window.AudioContext||window.webkitAudioContext;
      if(!AC)return;
      audioCtx=new AC();
      masterGain=audioCtx.createGain();masterGain.gain.value=.55;masterGain.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){console.warn('Audio konnte nicht gestartet werden',e);return}
  if(masterGain)return;
  masterGain=audioCtx.createGain();masterGain.gain.value=.55;masterGain.connect(audioCtx.destination);
  
  }
function tone(freq,dur,type='sine',vol=.08,slide=0){
  if(!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
  if(slide)o.frequency.linearRampToValueAtTime(Math.max(30,freq+slide),audioCtx.currentTime+dur);
  g.gain.setValueAtTime(vol,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+dur+.02);
}
function startEngineSound(){
  if(!audioCtx||engineOsc)return;
  engineOsc=audioCtx.createOscillator();const g=audioCtx.createGain();engineOsc.type='sawtooth';engineOsc.frequency.value=75;g.gain.value=.07;engineOsc.connect(g);g.connect(masterGain);engineOsc.start();
}
function startRainSound(){
  if(!audioCtx||rainSource)return;
  const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate),data=buffer.getChannelData(0);
  for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.35;
  rainSource=audioCtx.createBufferSource();rainSource.buffer=buffer;rainSource.loop=true;
  const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1700;
  rainGain=audioCtx.createGain();rainGain.gain.value=.09;rainSource.connect(filter);filter.connect(rainGain);rainGain.connect(masterGain);rainSource.start();
}
function playShot(){initAudio();tone(170,.10,'square',.22,150)}
function playExplosion(){initAudio();tone(90,.28,'sawtooth',.25,-65);setTimeout(()=>tone(45,.22,'triangle',.18,-20),45)}
function playMission(success){tone(success?620:120,.18,'sine',.12,success?260:-50);setTimeout(()=>tone(success?880:70,.28,'sine',.10,success?180:-20),110)}
function playBuy(){tone(520,.09,'sine',.10,180);setTimeout(()=>tone(780,.14,'sine',.10,220),90)}

const PAYPAL_URL='https://www.paypal.com/donate/?hosted_button_id=HF3HYZ9J3QV4U';
function save(){localStorage.setItem(stateKey,JSON.stringify(gameState));hud()}function notify(t){const n=document.getElementById('notification');n.textContent=t;n.style.display='block';setTimeout(()=>n.style.display='none',2200)}
function hud(){document.getElementById('hud-level').textContent=`Mission ${gameState.currentLevel} / ${gameState.maxLevels}`;document.getElementById('hud-credits').textContent=`Credits ${gameState.credits}`;document.getElementById('hud-targets').textContent=`Feinde ${gameState.targetsLeft||0}`;document.getElementById('menuStats').textContent=`Mission ${gameState.currentLevel}  •  Credits ${gameState.credits}  •  Jet: ${planes[gameState.plane].name}`}
function buildShop(){const g=document.getElementById('shopGrid');g.innerHTML='';Object.entries(planes).forEach(([id,p])=>{const owned=gameState.owned.includes(id),selected=gameState.plane===id;const d=document.createElement('div');d.className='card';d.innerHTML=`<h3>${p.name}</h3><p>Waffenschaden: <b>${p.damage}x</b><br>Feuerrate: <b>${Math.round(1000/p.fireRate*10)/10}/s</b><br>Geschwindigkeit: <b>${p.speed.toFixed(2)}x</b></p><div class="price">${p.price?p.price+' Credits':'STARTER'}</div><button class="btn ${selected?'dark':''}" style="width:100%;margin:8px 0 0" id="card_${id}">${selected?'AUSGEWÄHLT':owned?'AUSWÄHLEN':`KAUFEN – ${p.price}`}</button>`;g.appendChild(d);d.querySelector('button').onclick=()=>buyPlane(id)})}
function buyPlane(id){initAudio();const p=planes[id];if(gameState.owned.includes(id)){gameState.plane=id;save();buildShop();notify(`${p.name} ausgewählt`);return}if(gameState.credits<p.price){notify('Nicht genug Credits');return}gameState.credits-=p.price;gameState.owned.push(id);gameState.plane=id;save();buildShop();playBuy();notify(`${p.name} gekauft – stärkere Waffen aktiviert!`)}
function createJet(color){const g=new THREE.Group();const m=new THREE.MeshStandardMaterial({color,roughness:.3,metalness:.25});const c=new THREE.MeshStandardMaterial({color:0x73efff,transparent:true,opacity:.65});const body=new THREE.Mesh(new THREE.ConeGeometry(.8,4.5,6),m);body.rotation.x=Math.PI/2;g.add(body);const wing=new THREE.Mesh(new THREE.BoxGeometry(5.5,.09,1.15),m);wing.position.z=-.45;g.add(wing);const tail=new THREE.Mesh(new THREE.BoxGeometry(2,.07,.6),m);tail.position.z=1.6;g.add(tail);const fin=new THREE.Mesh(new THREE.BoxGeometry(.08,.9,.6),m);fin.position.set(0,.45,1.6);g.add(fin);const cockpit=new THREE.Mesh(new THREE.SphereGeometry(.35,8,8),c);cockpit.scale.set(1,1,2);cockpit.position.set(0,.35,-.6);g.add(cockpit);return g}
let scene,camera,renderer,player,enemyJets=[],bullets=[],rain,sea;let inputX=0,inputY=0,isPlaying=false,touchId=null,lastShot=0;
function makeSea(){const geo=new THREE.PlaneGeometry(3000,3000,80,80);const pos=geo.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i);pos.setZ(i,Math.sin(x*.035)*.16+Math.cos(y*.028)*.12)}geo.computeVertexNormals();sea=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x07506a,roughness:.22,metalness:.25,transparent:true,opacity:.96}));sea.rotation.x=-Math.PI/2;sea.position.y=-22;sea.position.z=-900;scene.add(sea)}
function makeRain(){const count=1800,geo=new THREE.BufferGeometry(),a=new Float32Array(count*3);for(let i=0;i<count;i++){a[i*3]=(Math.random()-.5)*180;a[i*3+1]=Math.random()*100-10;a[i*3+2]=-Math.random()*500+80}geo.setAttribute('position',new THREE.BufferAttribute(a,3));rain=new THREE.Points(geo,new THREE.PointsMaterial({color:0xbdefff,size:.16,transparent:true,opacity:.65}));scene.add(rain)}
function init(){const c=document.getElementById('canvas-container');scene=new THREE.Scene();scene.background=new THREE.Color(0x071522);scene.fog=new THREE.FogExp2(0x071522,.008);camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,1200);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));c.appendChild(renderer.domElement);scene.add(new THREE.AmbientLight(0x8aa7b8,.55));const sun=new THREE.DirectionalLight(0xc7eaff,.75);sun.position.set(-30,80,20);scene.add(sun);makeSea();makeRain();player=createJet(planes[gameState.plane].color);scene.add(player);camera.position.set(0,8,11);addEventListener('resize',resize);initControls();hud()}
function spawn(){enemyJets.forEach(e=>scene.remove(e));enemyJets=[];gameState.targetsLeft=2+gameState.currentLevel;for(let i=0;i<gameState.targetsLeft;i++){const e=createJet(0xd52e3f);e.position.set((Math.random()-.5)*100,Math.random()*35-3,-80-Math.random()*260);e.rotation.y=Math.PI;scene.add(e);enemyJets.push(e)}hud()}
function start(){initAudio();tone(440,.12,'sine',.18,220);startEngineSound();startRainSound();document.getElementById('menu').classList.add('hidden');document.getElementById('result').classList.add('hidden');player=newPlayer();player.position.set(0,7,0);spawn();isPlaying=true}
function newPlayer(){if(player)scene.remove(player);player=createJet(planes[gameState.plane].color);scene.add(player);return player}
function shoot(){if(!isPlaying)return;const p=planes[gameState.plane],now=performance.now();if(now-lastShot<p.fireRate)return;lastShot=now;playShot();for(let k=0;k<p.damage;k++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.08,.08,2.4,5),new THREE.MeshBasicMaterial({color:0x7ff7ff}));b.rotation.x=Math.PI/2;b.position.copy(player.position);b.position.x+=(k-(p.damage-1)/2)*.35;b.position.z-=2;scene.add(b);bullets.push(b)}}
function resetPayPalTimer(){if(paypalTimer){clearInterval(paypalTimer);paypalTimer=null}paypalStartedAt=0;paypalWaiting=false}
function checkPayPalReturn(){if(!paypalWaiting)return;const elapsed=Date.now()-paypalStartedAt;if(elapsed>=30000){gameState.credits+=500;save();notify('Credits wurden gutgeschrieben');}resetPayPalTimer()}
function openCredits(){resetPayPalTimer();paypalStartedAt=Date.now();paypalWaiting=true;window.open(PAYPAL_URL,'_blank');paypalTimer=setInterval(()=>{if(paypalWaiting&&Date.now()-paypalStartedAt>=30000){clearInterval(paypalTimer);paypalTimer=null}},250)}
window.addEventListener('focus',checkPayPalReturn);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkPayPalReturn()});window.addEventListener('pageshow',checkPayPalReturn);
function end(success){isPlaying=false;playMission(success);document.getElementById('result').classList.remove('hidden');document.getElementById('resultTitle').textContent=success?'MISSION ERFÜLLT':'MISSION FEHLGESCHLAGEN';document.getElementById('resultDesc').textContent=success?`+60 Credits – ${planes[gameState.plane].name} war erfolgreich!`:'Ein Feind hat die Verteidigungslinie erreicht.';document.getElementById('next').style.display=success?'block':'none';document.getElementById('retry').style.display=success?'none':'block';document.getElementById('resultBuy').classList.toggle('hidden',gameState.credits>=100);if(success){gameState.credits+=60;if(gameState.currentLevel<gameState.maxLevels)gameState.currentLevel++}save()}
function animate(){requestAnimationFrame(animate);if(isPlaying){const p=planes[gameState.plane],vs=inputY<0?.72*p.speed:.48*p.speed;player.position.x+=inputX*.45*p.speed;player.position.y+=inputY*vs;player.position.x=Math.max(-55,Math.min(55,player.position.x));player.position.y=Math.max(-19,Math.min(40,player.position.y));player.rotation.z=-inputX*.6;player.rotation.x=inputY*.4;camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x,.08);camera.position.y=THREE.MathUtils.lerp(camera.position.y,player.position.y+3.5,.08);camera.lookAt(player.position.x,player.position.y+.5,player.position.z-18);rain.position.z=player.position.z;const a=rain.geometry.attributes.position.array;for(let i=0;i<a.length;i+=3){a[i+1]-=1.5;if(a[i+1]<-20)a[i+1]=90;a[i+2]+=2.3;if(a[i+2]>30)a[i+2]=-500}rain.geometry.attributes.position.needsUpdate=true;for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.position.z-=3.8*p.speed;let hit=false;for(let j=enemyJets.length-1;j>=0;j--){const e=enemyJets[j];if(b.position.distanceTo(e.position)<3.4){scene.remove(e);enemyJets.splice(j,1);gameState.targetsLeft--;playExplosion();hit=true;break}}if(hit||b.position.z<-600){scene.remove(b);bullets.splice(i,1)}}enemyJets.forEach(e=>{e.position.z+=.18+gameState.currentLevel*.012;e.position.y+=Math.sin(performance.now()*.002+e.position.x)*.018;e.rotation.z=Math.sin(performance.now()*.001+e.position.x)*.08});if(gameState.targetsLeft<=0)end(true);else if(enemyJets.some(e=>e.position.z>player.position.z+5))end(false);hud()}renderer.render(scene,camera)}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function joy(x,y){const r=document.getElementById('joystick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=x-cx,dy=y-cy,d=Math.hypot(dx,dy),max=50;if(d>max){dx=dx/d*max;dy=dy/d*max}document.getElementById('knob').style.transform=`translate(${dx}px,${dy}px)`;inputX=dx/max;inputY=-dy/max}
function initControls(){const z=document.getElementById('joystick');z.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];touchId=t.identifier;joy(t.clientX,t.clientY)},{passive:false});addEventListener('touchmove',e=>{if(touchId===null)return;for(const t of e.touches)if(t.identifier===touchId){joy(t.clientX,t.clientY);break}},{passive:false});addEventListener('touchend',e=>{for(const t of e.touches)if(t.identifier===touchId)return;touchId=null;inputX=inputY=0;document.getElementById('knob').style.transform='translate(0,0)'});document.getElementById('fire').addEventListener('touchstart',e=>{e.preventDefault();shoot()},{passive:false});document.getElementById('fire').addEventListener('click',shoot)}
document.getElementById('start').onclick=start;document.getElementById('openShop').onclick=()=>{buildShop();document.getElementById('menu').classList.add('hidden');document.getElementById('shop').classList.remove('hidden')};document.getElementById('closeShop').onclick=()=>{document.getElementById('shop').classList.add('hidden');document.getElementById('menu').classList.remove('hidden');hud()};document.getElementById('buyCredits').onclick=openCredits;document.getElementById('resultBuy').onclick=openCredits;document.getElementById('resultShop').onclick=()=>{document.getElementById('result').classList.add('hidden');document.getElementById('shop').classList.remove('hidden');buildShop()};document.getElementById('next').onclick=start;document.getElementById('retry').onclick=start;
init();requestAnimationFrame(animate);
</script></body></html>
