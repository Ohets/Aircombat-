<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Air Combat Ultimate</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            box-sizing: border-box;
        }
        .hud-box {
            background: rgba(10, 25, 50, 0.75);
            border: 2px solid #00f0ff;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
            border-radius: 8px;
            padding: 10px 15px;
            color: #00f0ff;
            font-weight: bold;
            font-size: 16px;
            pointer-events: auto;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        #top-hud {
            display: flex;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
        }
        #controls-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            width: 100%;
            pointer-events: none;
        }
        .joystick-zone {
            width: 130px;
            height: 130px;
            background: rgba(0, 240, 255, 0.05);
            border: 3px dashed rgba(0, 240, 255, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            pointer-events: auto;
        }
        #joystick-knob {
            width: 50px;
            height: 50px;
            background: #00f0ff;
            border-radius: 50%;
            box-shadow: 0 0 15px #00f0ff;
            position: absolute;
            pointer-events: none;
        }
        .fire-btn {
            width: 90px;
            height: 90px;
            background: rgba(255, 0, 55, 0.3);
            border: 3px solid #ff0037;
            border-radius: 50%;
            color: #ff0037;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255, 0, 55, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            pointer-events: auto;
            cursor: pointer;
        }
        .fire-btn:active {
            transform: scale(0.9);
            background: rgba(255, 0, 55, 0.6);
        }
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 12, 24, 0.9);
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 10;
        }
        .hidden { display: none !important; }
        h1 {
            color: #00f0ff;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.7);
            font-size: 36px;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }
        h2 { color: #8ab4f8; font-size: 18px; margin-bottom: 25px; font-weight: normal; }
        .menu-btn {
            background: linear-gradient(135deg, #0055ff, #00f0ff);
            border: none;
            color: white;
            padding: 15px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin: 8px;
            box-sizing: border-box;
            box-shadow: 0 5px 15px rgba(0, 240, 255, 0.4);
            width: 280px;
            text-transform: uppercase;
            transition: all 0.2s;
            text-align: center;
        }
        .menu-btn:active { transform: scale(0.96); }
        .danger-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }
        .paypal-btn {
            background: linear-gradient(135deg, #003087, #0079c1);
            border: 1px solid #00aef0;
            box-shadow: 0 5px 15px rgba(0, 121, 193, 0.4);
        }
        .status-text {
            font-size: 18px;
            margin: 15px;
            color: #00ffaa;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
            text-align: center;
            max-width: 80%;
        }
        .notification {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 170, 0.9);
            color: #050b14;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.6);
            z-index: 99;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="notification-box" class="notification hidden"></div>

    <!-- HUD -->
    <div id="ui-layer">
        <div id="top-hud">
            <div class="hud-box" id="hud-level">Mission: 1 / 40</div>
            <div class="hud-box" id="hud-credits">Credits: 0</div>
            <div class="hud-box" id="hud-targets">Feinde: 0</div>
        </div>
        
        <div id="controls-hud">
            <div class="joystick-zone" id="joystick-boundary">
                <div id="joystick-knob"></div>
            </div>
            <div class="fire-btn" id="btn-fire">FEUER</div>
        </div>
    </div>

    <!-- MENÜ -->
    <div id="menu-screen" class="screen">
        <h1>AIR COMBAT 3D</h1>
        <h2>Premium Tactical Flight Simulator</h2>
        <div class="status-text" id="menu-stats">Lade Spieldaten...</div>
        <button class="menu-btn" id="btn-start">Mission Starten</button>
        <button class="menu-btn paypal-btn" id="btn-buy-menu">500 Credits erhalten (PayPal)</button>
    </div>

    <!-- ERGEBNIS-SCREEN -->
    <div id="result-screen" class="screen hidden">
        <h1 id="result-title">MISSION ERFÜLLT</h1>
        <p class="status-text" id="result-desc"></p>
        
        <button class="menu-btn" id="btn-next">Nächste Mission</button>
        <button class="menu-btn danger-btn hidden" id="btn-skip">Mission überspringen (100 Crt)</button>
        <button class="menu-btn paypal-btn hidden" id="btn-buy-result">Credits aufladen (PayPal)</button>
        <button class="menu-btn" id="btn-retry">Erneut versuchen</button>
    </div>

    <script>
        // --- SPEICHERSYSTEM & WIRTSCHAFT ---
        let gameState = {
            currentLevel: 1,
            maxLevels: 40,
            credits: 100,
            targetsLeft: 3
        };

        const SKIP_COST = 100;
        const LEVEL_REWARD = 60;
        const PAYPAL_URL = "https://www.paypal.com/donate/?hosted_button_id=HF3HYZ9J3QV4U";

        if(localStorage.getItem('aircombat_v3_state')) {
            gameState = JSON.parse(localStorage.getItem('aircombat_v3_state'));
        }

        function saveGame() {
            localStorage.setItem('aircombat_v3_state', JSON.stringify(gameState));
            updateHUD();
        }

        function showNotification(text) {
            const box = document.getElementById('notification-box');
            box.innerText = text;
            box.classList.remove('hidden');
            box.style.opacity = '1';
            
            setTimeout(() => {
                box.style.opacity = '0';
                setTimeout(() => box.classList.add('hidden'), 500);
            }, 3000);
        }

        // Simulierter Kauf-Trigger beim Klick auf PayPal
        function triggerPayPalPurchase() {
            window.open(PAYPAL_URL, '_blank');
            
            // Sofortige Gutschrift im Hintergrund für optimale User-Experience im Prototyp
            setTimeout(() => {
                gameState.credits += 500;
                saveGame();
                showNotification("🎉 +500 Credits erfolgreich gutgeschrieben!");
                
                // UI Aktualisierung falls wir auf dem Result-Screen sind
                if(!isPlaying) {
                    const skipBtn = document.getElementById('btn-skip');
                    const buyBtn = document.getElementById('btn-buy-result');
                    if(gameState.credits >= SKIP_COST && skipBtn && !skipBtn.classList.contains('hidden')) {
                        skipBtn.innerText = `Überspringen (${SKIP_COST} Credits)`;
                        skipBtn.removeAttribute('disabled');
                        skipBtn.style.opacity = "1";
                        buyBtn.classList.add('hidden');
                    }
                }
            }, 800);
        }

        // --- CORE SYNTH AUDIO ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playLaserSound() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        }

        function playExplosionSound() {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }

        // --- THREE.JS GENERATION ---
        let scene, camera, renderer;
        let playerJet;
        let enemyJets = [];
        let bullets = [];
        let inputX = 0, inputY = 0;
        let isPlaying = false;
        let joystickTouchId = null;

        // Hilfsfunktion zum Erstellen von Jet-Modellen
        function createJetMesh(colorHex, isEnemy = false) {
            const jetGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.2 });
            const cockpitMat = new THREE.MeshStandardMaterial({ color: 0x00ffff, transparent: true, opacity: 0.6 });

            // Rumpf
            const bodyGeo = new THREE.ConeGeometry(0.8, 4.5, 5);
            bodyGeo.rotateX(isEnemy ? -Math.PI / 2 : Math.PI / 2);
            const body = new THREE.Mesh(bodyGeo, mat);
            jetGroup.add(body);

            // Hauptflügel
            const wingGeo = new THREE.BoxGeometry(5.5, 0.08, 1.2);
            const wing = new THREE.Mesh(wingGeo, mat);
            wing.position.set(0, 0, isEnemy ? 0.5 : -0.5);
            jetGroup.add(wing);

            // Heckflügel
            const tailWingGeo = new THREE.BoxGeometry(2, 0.06, 0.6);
            const tailWing = new THREE.Mesh(tailWingGeo, mat);
            tailWing.position.set(0, 0, isEnemy ? -1.6 : 1.6);
            jetGroup.add(tailWing);

            // Vertikale Heckflosse
            const finGeo = new THREE.BoxGeometry(0.06, 0.9, 0.6);
            const fin = new THREE.Mesh(finGeo, mat);
            fin.position.set(0, 0.45, isEnemy ? -1.6 : 1.6);
            jetGroup.add(fin);

            // Cockpit-Kanzel
            const cockpitGeo = new THREE.SphereGeometry(0.35, 8, 8);
            cockpitGeo.scale(1, 1, 2);
            const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
            cockpit.position.set(0, 0.35, isEnemy ? 0.6 : -0.6);
            jetGroup.add(cockpit);

            return jetGroup;
        }

        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x040814);
            scene.fog = new THREE.FogExp2(0x040814, 0.012);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0x00f0ff, 0.9);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            // Bodengitter
            const gridHelper = new THREE.GridHelper(3000, 120, 0x00d2ff, 0x001633);
            gridHelper.position.y = -25;
            scene.add(gridHelper);

            // Eigenes Flugzeug generieren
            playerJet = createJetMesh(0x3a6094, false);
            scene.add(playerJet);

            camera.position.set(0, 3.5, 9.5);

            window.addEventListener('resize', onWindowResize, false);
            initKeyboardControls();
        }

        function spawnEnemyJets() {
            enemyJets.forEach(e => scene.remove(e));
            enemyJets = [];

            gameState.targetsLeft = 2 + gameState.currentLevel;
            updateHUD();

            for(let i=0; i < gameState.targetsLeft; i++) {
                // Feindlicher Jet in aggressivem Rot/Schwarz
                const enemyJet = createJetMesh(0xd62828, true);
                
                enemyJet.position.set(
                    (Math.random() - 0.5) * 70,
                    (Math.random() - 0.5) * 25 + 6,
                    -60 - (Math.random() * 120)
                );
                
                scene.add(enemyJet);
                enemyJets.push(enemyJet);
            }
        }

        function fireBullet() {
            if(!isPlaying) return;
            playLaserSound();

            const bulletGeo = new THREE.CylinderGeometry(0.06, 0.06, 2, 4);
            bulletGeo.rotateX(Math.PI / 2);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);
            
            bullet.position.copy(playerJet.position);
            bullet.position.z -= 2;
            scene.add(bullet);
            bullets.push(bullet);
        }

        // --- SCHLEIFE (LOOP) ---
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Bewegung des Spielers
                playerJet.position.x += inputX * 0.45;
                playerJet.position.y += inputY * 0.45;
                
                playerJet.position.x = Math.max(-45, Math.min(45, playerJet.position.x));
                playerJet.position.y = Math.max(1, Math.min(32, playerJet.position.y));

                // Visuelle Rotation bei Steuerung
                playerJet.rotation.z = -inputX * 0.6;
                playerJet.rotation.x = inputY * 0.25;
                playerJet.rotation.y = inputX * 0.15;

                // Kamera-Verfolgung
                camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerJet.position.x, 0.08);
                camera.position.y = THREE.MathUtils.lerp(camera.position.y, playerJet.position.y + 3.2, 0.08);
                camera.lookAt(playerJet.position.x, playerJet.position.y + 0.8, playerJet.position.z - 15);

                // Laser-Projektile fliegen lassen
                for(let i = bullets.length - 1; i >= 0; i--) {
                    let b = bullets[i];
                    b.position.z -= 3.5;

                    // Kollisionsprüfung mit echten 3D Feind-Flugzeugen
                    for(let j = enemyJets.length - 1; j >= 0; j--) {
                        let e = enemyJets[j];
                        if(b.position.distanceTo(e.position) < 3.2) {
                            playExplosionSound();
                            scene.remove(e);
                            enemyJets.splice(j, 1);
                            scene.remove(b);
                            bullets.splice(i, 1);
                            
                            gameState.targetsLeft--;
                            updateHUD();
                            break;
                        }
                    }

                    if(b && b.position.z < -250) {
                        scene.remove(b);
                        bullets.splice(i, 1);
                    }
                }

                // Feindliche Flieger bewegen sich auf den Spieler zu
                enemyJets.forEach(e => {
                    e.position.z += 0.22 + (gameState.currentLevel * 0.015);
                    // Leichtes Schweben/Wobbeln der KI
                    e.position.y += Math.sin(Date.now() * 0.002 + e.position.x) * 0.02;
                });

                // Gewinn- und Verlustkondition
                if(gameState.targetsLeft <= 0) {
                    endGame(true);
                } else if(enemyJets.some(e => e.position.z > camera.position.z)) {
                    endGame(false);
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- UI INTERFACE STEUERUNG ---
        function updateHUD() {
            document.getElementById('hud-level').innerText = `Mission: ${gameState.currentLevel} / ${gameState.maxLevels}`;
            document.getElementById('hud-credits').innerText = `Credits: ${gameState.credits}`;
            document.getElementById('hud-targets').innerText = `Feinde: ${gameState.targetsLeft}`;
            document.getElementById('menu-stats').innerText = `Aktuelle Mission: ${gameState.currentLevel} | Credits: ${gameState.credits}`;
        }

        function startGame() {
            document.getElementById('menu-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
            
            playerJet.position.set(0, 6, 0);
            bullets.forEach(b => scene.remove(b));
            bullets = [];
            
            spawnEnemyJets();
            isPlaying = true;
            audioCtx.resume();
        }

        function endGame(success) {
            isPlaying = false;
            const screen = document.getElementById('result-screen');
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const nextBtn = document.getElementById('btn-next');
            const skipBtn = document.getElementById('btn-skip');
            const buyBtn = document.getElementById('btn-buy-result');

            screen.classList.remove('hidden');

            if(success) {
                title.innerText = "MISSION ERFÜLLT";
                title.style.color = "#00ffaa";
                gameState.credits += LEVEL_REWARD;
                desc.innerText = `Hervorragend geflogen! +${LEVEL_REWARD} Credits erhalten.`;
                
                if(gameState.currentLevel < gameState.maxLevels) {
                    gameState.currentLevel++;
                }
                nextBtn.classList.remove('hidden');
                skipBtn.classList.add('hidden');
                buyBtn.classList.add('hidden');
            } else {
                title.innerText = "MISSION FEHLGESCHLAGEN";
                title.style.color = "#ff0055";
                desc.innerText = "Die feindlichen Abfangjäger sind durchgebrochen!";
                
                nextBtn.classList.add('hidden');
                skipBtn.classList.remove('hidden');
                
                if(gameState.credits >= SKIP_COST) {
                    skipBtn.innerText = `Überspringen (${SKIP_COST} Credits)`;
                    skipBtn.removeAttribute('disabled');
                    skipBtn.style.opacity = "1";
                    buyBtn.classList.add('hidden');
                } else {
                    skipBtn.innerText = `Nicht genug Credits (${SKIP_COST} benötigt)`;
                    skipBtn.setAttribute('disabled', 'true');
                    skipBtn.style.opacity = "0.5";
                    buyBtn.classList.remove('hidden');
                }
            }
            saveGame();
        }

        // --- BUTTON REGISTER ---
        document.getElementById('btn-start').addEventListener('click', startGame);
        document.getElementById('btn-retry').addEventListener('click', startGame);
        document.getElementById('btn-next').addEventListener('click', startGame);
        
        document.getElementById('btn-buy-menu').addEventListener('click', triggerPayPalPurchase);
        document.getElementById('btn-buy-result').addEventListener('click', triggerPayPalPurchase);

        document.getElementById('btn-skip').addEventListener('click', () => {
            if(gameState.credits >= SKIP_COST) {
                gameState.credits -= SKIP_COST;
                if(gameState.currentLevel < gameState.maxLevels) gameState.currentLevel++;
                saveGame();
                startGame();
            }
        });

        // Schuss-Aktivierung
        const fireBtn = document.getElementById('btn-fire');
        fireBtn.addEventListener('touchstart', (e) => { e.preventDefault(); fireBullet(); });
        fireBtn.addEventListener('mousedown', (e) => { e.preventDefault(); fireBullet(); });

        // --- FIX MOBIL JOYSTICK INTERACTION ---
        const joystickZone = document.getElementById('joystick-boundary');
        const joystickKnob = document.getElementById('joystick-knob');

        function parseJoystickMove(clientX, clientY) {
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            
            let dx = clientX - centerX;
            let dy = clientY - centerY;
            const maxDist = 50;
            const currentDist = Math.sqrt(dx*dx + dy*dy);
            
            if(currentDist > maxDist) {
                dx = (dx / currentDist) * maxDist;
                dy = (dy / currentDist) * maxDist;
            }

            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            inputX = dx / maxDist;
            inputY = -dy / maxDist; // Flugsteuerung: Ziehen = Steigen
        }

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.changedTouches[0];
            joystickTouchId = touch.identifier;
            parseJoystickMove(touch.clientX, touch.clientY);
        }, {passive: false});

        window.addEventListener('touchmove', (e) => {
            if(joystickTouchId !== null) {
                for(let i=0; i<e.touches.length; i++) {
                    if(e.touches[i].identifier === joystickTouchId) {
                        parseJoystickMove(e.touches[i].clientX, e.touches[i].clientY);
                        break;
                    }
                }
            }
        }, {passive: false});

        const endJoystick = (e) => {
            if(joystickTouchId !== null) {
                let vanished = false;
                if(e.type === 'touchend' || e.type === 'touchcancel') {
                    vanished = true;
                    for(let i=0; i<e.touches.length; i++) {
                        if(e.touches[i].identifier === joystickTouchId) vanished = false;
                    }
                } else {
                    vanished = true;
                }
                
                if(vanished) {
                    joystickTouchId = null;
                    joystickKnob.style.transform = 'translate(0px, 0px)';
                    inputX = 0; inputY = 0;
                }
            }
        };

        window.addEventListener('touchend', endJoystick);
        window.addEventListener('touchcancel', endJoystick);

        // --- KEYBOARD BACKUP CONTROLS (PC) ---
        let keys = {};
        function initKeyboardControls() {
            window.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if(e.code === 'Space') fireBullet();
            });
            window.addEventListener('keyup', (e) => {
                keys[e.code] = false;
            });

            // In Game Loop einbetten
            setInterval(() => {
                if(!isPlaying || joystickTouchId !== null) return;
                
                let kX = 0; let kY = 0;
                if(keys['ArrowLeft'] || keys['KeyA']) kX = -1;
                if(keys['ArrowRight'] || keys['KeyD']) kX = 1;
                if(keys['ArrowUp'] || keys['KeyW']) kY = 1;
                if(keys['ArrowDown'] || keys['KeyS']) kY = -1;
                
                inputX = THREE.MathUtils.lerp(inputX, kX, 0.2);
                inputY = THREE.MathUtils.lerp(inputY, kY, 0.2);
            }, 1000/60);
        }

        // Start
        init3D();
        updateHUD();
        animate();
    </script>
</body>
</html>
